<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crop Guide</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">

        🌾

        <span data-i18n="siteTitle">
            Farmer Crop Guide
        </span>

    </div>


    <nav>

        <a href="index.html"
           data-i18n="home">
            Home
        </a>

        <a href="crop-guide.html"
           data-i18n="cropGuide">
            Crop Guide
        </a>

        <a href="soil-guide.html"
           data-i18n="soilGuide">
            Soil Guide
        </a>

        <a href="tips.html"
           data-i18n="tips">
            Farming Tips
        </a>

    </nav>


    <div class="language-box">

        <label
            data-i18n="language"
            for="languageSelect"
        >
            Language
        </label>

        <select id="languageSelect">

            <option value="en">
                English
            </option>

            <option value="te">
                తెలుగు
            </option>

            <option value="hi">
                हिन्दी
            </option>

        </select>

    </div>

</header>



<section class="page-header">

    <h1 data-i18n="cropGuide">
        Crop Guide
    </h1>

</section>



<section class="all-crops">

    <div
        id="results"
        class="results"
    ></div>

</section>



<script src="script.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const results =
            document.getElementById("results");

        try {

            const response =
                await fetch(
                    "http://localhost:3000/api/crops"
                );

            const crops =
                await response.json();

            const language =
                getLanguage();

            const data =
                translations[language];

            results.innerHTML = "";


            crops.forEach(crop => {

                const translated =
                    translateCrop(crop);


                const card =
                    document.createElement("div");

                card.className =
                    "crop-card";


                card.innerHTML = `

                    <div
                        class="crop-image"
                        style="
                            background-image:
                            linear-gradient(
                                rgba(0,0,0,0.45),
                                rgba(0,0,0,0.45)
                            ),
                            url('${crop.image}');
                        "
                    >

                        <div class="crop-card-content">

                            <h3>
                                ${translated.displayName}
                            </h3>

                            <p>
                                ${translated.displayDescription}
                            </p>

                            <button
                                onclick="showCropDetails('${crop.name}')"
                            >
                                ${data.learnMore}
                            </button>

                        </div>

                    </div>

                `;


                results.appendChild(card);

            });

        }

        catch (error) {

            console.error(error);

        }

    }

);

</script>

</body>

</html>
